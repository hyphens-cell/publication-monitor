[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:datetime.datetime.utcnow.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".venv", "instance"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
