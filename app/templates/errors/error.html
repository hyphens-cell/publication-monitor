<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ status_code }} — {{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <main class="container py-5">
        <section class="card card-pm border-0 mx-auto" style="max-width: 620px;">
            <div class="card-body p-4 p-md-5 text-center">
                <p class="display-5 fw-bold mb-2">{{ status_code }}</p>
                <h1 class="h4 mb-3">{{ title }}</h1>
                <p class="text-body-secondary mb-4">{{ message }}</p>
                {% if current_user.is_authenticated %}
                    <a class="btn btn-primary" href="{{ url_for('main.index') }}">На главную</a>
                {% else %}
                    <a class="btn btn-primary" href="{{ url_for('auth.login') }}">К странице входа</a>
                {% endif %}
            </div>
        </section>
    </main>
</body>
</html>
