<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Мониторинг публикаций</title>
</head>
<body>
    <main>
        <h1>Мониторинг публикационной активности</h1>
        <h2>Вход в систему</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section>
                    {% for category, message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        <form method="post">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div>
                <label for="username">Логин</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                >
            </div>

            <div>
                <label for="password">Пароль</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">Войти</button>
        </form>
    </main>
</body>
</html>
