{% macro icon(name, class_name='') -%}
<svg class="pm-icon {{ class_name }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'home' %}<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>
{% elif name == 'users' %}<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/>
{% elif name == 'building' %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h1m4 0h1M9 11h1m4 0h1m-6 4h1m4 0h1m-5 6v-3h4v3"/>
{% elif name == 'chart' %}<path d="M4 3v17h17M8 16v-5m5 5V6m5 10V9"/>
{% elif name == 'plan' %}<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 11h16m-12 4h2m4 0h2"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'monitor' %}<path d="M3 12h4l3-8 4 16 3-8h4"/>
{% elif name == 'settings' %}<path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3" fill="var(--pm-surface)"/><circle cx="16" cy="17" r="3" fill="var(--pm-surface)"/>
{% elif name == 'archive' %}<rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v13h14V8M10 12h4"/>
{% elif name == 'bell' %}<path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 21h4"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'panel' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'back' %}<path d="M20 12H4m6-6-6 6 6 6"/>
{% elif name == 'download' %}<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>
{% elif name == 'upload' %}<path d="M12 16V4m-5 5 5-5 5 5M4 17v4h16v-4"/>
{% elif name == 'edit' %}<path d="m4 16-1 5 5-1L20 8l-4-4Zm10-10 4 4"/>
{% elif name == 'plus' %}<path d="M12 4v16M4 12h16"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'alert' %}<path d="m12 3 10 18H2Z"/><path d="M12 9v5m0 3h.01"/>
{% elif name == 'search' %}<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>
{% elif name == 'refresh' %}<path d="M20 7a9 9 0 1 0 1 9M20 3v5h-5"/>
{% elif name == 'list' %}<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
{% else %}<path d="M14 3H5v18h14V8Z"/><path d="M14 3v5h5M8 12h8m-8 4h8"/>{% endif %}
</svg>
{%- endmacro %}
{% macro nav_link(endpoint, label, symbol, active=false, params={}) -%}
<a class="pm-nav-link{% if active %} active{% endif %}" href="{{ url_for(endpoint, **params) }}" {% if active %}aria-current="page"{% endif %} title="{{ tr(label) }}">{{ icon(symbol) }}<span class="pm-nav-label">{{ tr(label) }}</span></a>
{%- endmacro %}
{% macro bar(label, value, maximum, tone='primary') -%}
<div class="pm-chart-row"><span class="pm-chart-label">{{ label }}</span><div class="pm-chart-track" aria-hidden="true"><span class="pm-chart-bar pm-chart-bar-{{ tone }}" style="width: {{ [100, ((value / maximum * 100) if maximum else 0)]|min }}%"></span></div><strong class="pm-chart-value">{{ value }}</strong></div>
{%- endmacro %}
