<section class="card card-pm border-0 mt-4 mb-4" aria-labelledby="discussion-title">
  <div class="card-body p-4">
    <h2 id="discussion-title" class="h5">{{ tr('Комментарии и ответы') }}</h2>
    {% for comment in comments %}
    <article class="border-bottom py-3">
      <div class="d-flex flex-wrap gap-2 justify-content-between">
        <strong>{{ comment.user.full_name }}</strong>
        <time class="small text-body-secondary">{{ comment.created_at.strftime('%d.%m.%Y %H:%M') }}</time>
      </div>
      <p class="mb-0 mt-2 text-break" style="white-space: pre-wrap">{{ tr(comment.text) }}</p>
    </article>
    {% else %}<p class="text-body-secondary">{{ tr('Комментариев пока нет.') }}</p>{% endfor %}
    <form method="post" action="{{ url_for('discussion.create_comment', entity_type=entity_type, entity_id=entity_id) }}" class="mt-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="discussion-text" class="form-label">{{ tr('Комментарий или ответ на замечание') }}</label>
      <textarea id="discussion-text" name="text" class="form-control mb-3" rows="3" required maxlength="5000"></textarea>
      <button class="btn btn-pm-primary" type="submit">{{ tr('Отправить комментарий') }}</button>
    </form>
  </div>
</section>
